[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "domiapp"
version = "0.1.0"
description = "DomiApp Backend"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.103.1",
    "uvicorn>=0.23.2",
    "pydantic>=2.3.0",
    "python-multipart>=0.0.6",
    "groq>=0.4.0",
    "langchain>=0.0.311",
    "langchain-openai>=0.0.2.post1",
    "langgraph>=0.0.24",
]

[project.optional-dependencies]
dev = ["black>=23.7.0", "isort>=5.12.0", "pytest>=7.4.0"]
