name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch: # Permite ejecutar el workflow manualmente

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE_NAME: bzzmn/domiapp-backend
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Image Tag
        id: set_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Crear directorio para la caché
      - name: Create cache directory
        run: mkdir -p /tmp/.buildx-cache

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          # Usar caché de Docker directamente en lugar de local
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.set_tag.outputs.tag }}
          # Agregar opción para diagnóstico
          outputs: type=docker,dest=/tmp/image.tar
          # No fallar en errores
          provenance: false
          sbom: false

      # Cargar la imagen para inspección si la construcción falló
      - name: Load image for inspection
        if: failure()
        run: |
          docker load < /tmp/image.tar || true
          docker image ls || true

      # Debug info
      - name: Debug information
        if: failure()
        run: |
          docker version
          ls -la /tmp/
          cat /tmp/.buildx-cache/index.json || echo "No cache index found"
        continue-on-error: true
